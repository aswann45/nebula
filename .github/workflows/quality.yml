name: Quality and release checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install 'poetry>=2.4,<3'
      - name: Install dependencies
        run: poetry install --with dev,ruff,docs
      - name: Lint
        run: poetry run ruff check .
      - name: Format
        run: poetry run ruff format --check .
      - name: Type check
        run: poetry run mypy src
      - name: Offline tests
        run: poetry run pytest -q
      - name: Build docs
        run: poetry run mkdocs build --strict
      - name: Build package
        run: poetry build
      - name: Install and smoke test wheel
        run: |
          python -m venv /tmp/nebula-wheel-smoke
          /tmp/nebula-wheel-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/nebula-wheel-smoke/bin/python -c 'import nebula; import importlib.resources as r; assert r.files("nebula").joinpath("py.typed").is_file()'
          /tmp/nebula-wheel-smoke/bin/nebula --help
