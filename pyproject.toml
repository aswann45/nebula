[project]
name = "nebula"
version = "0.1.0"
description = ""
authors = [
    {name = "aswann"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "us (>=4.0.0,<5.0.0)",
    "xmltodict (>=1.0.4,<2.0.0)",
    "typer (>=0.27.3,<0.28.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "aiometer (>=1.0.0,<2.0.0)",
    "inflect (>=7.5.0,<8.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[project.scripts]
nebula = "nebula.cli.main:app"

[tool.poetry]
packages = [{include = "nebula", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
ruff = [
    "mypy (>=2.4.0,<3.0.0)"
]
dev = [
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)",
    "types-xmltodict (>=1.0.1.20260518,<2.0.0.0)"
]

[tool.mypy]
python_executable = ".venv/bin/python"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true
warn_return_any = true
# disallow_any_unimported = true

[tool.ruff]
target-version = "py311"
line-length = 79
indent-width = 4
exclude = ["*/scripts/*", ".pre-commit-config.yaml", "tests/parsers/conftest.py", "tests/services/external_services/*/conftest.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "W", "C901", "ERA001"]
ignore = [
	"W191",
	"E111",
	"E114",
	"E117",
	"D206",
	"D300",
]
unfixable = ["B", "ERA001", "UP007", "UP045"]
extend-select = [
    "UP", "FIX002", "I", "FAST", "RUF", "DOC"
]

[tool.ruff.lint.mccabe]
max-complexity = 10
